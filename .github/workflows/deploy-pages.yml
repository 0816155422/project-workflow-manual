name: Deploy HAP/AICC Web Dashboard

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Validate site data before deployment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f hap-aicc/data/course-data.json ]]; then
            node scripts/validate-course-data.mjs hap-aicc/data/course-data.json
          else
            echo "Awaiting approved dataset; static site will display a visible pending state."
          fi
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./hap-aicc
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
