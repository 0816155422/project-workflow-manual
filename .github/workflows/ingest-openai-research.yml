name: Validate OpenAI research evidence

on:
  push:
    paths:
      - 'raw_data/openai_research/**'
      - 'scripts/validate-openai-research.mjs'
      - '.github/workflows/ingest-openai-research.yml'
  pull_request:
    paths:
      - 'raw_data/openai_research/**'
      - 'scripts/validate-openai-research.mjs'
      - '.github/workflows/ingest-openai-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate source records and provenance
        run: node scripts/validate-openai-research.mjs
