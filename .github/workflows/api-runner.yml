name: GitHub Actions API Runner (Read Only)

on:
  push:
    branches: [main, feat/github-actions-api-runner]
  pull_request:
    paths:
      - .github/workflows/api-runner.yml
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only repository operation"
        required: true
        type: choice
        options: [repository_status, list_files, read_file]
        default: repository_status
      path:
        description: "Repository-relative path"
        required: false
        type: string
        default: ""
      branch:
        description: "Target branch (defaults to workflow branch)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      operation:
        description: "Read-only repository operation"
        required: false
        type: string
        default: repository_status
      path:
        description: "Repository-relative path"
        required: false
        type: string
        default: ""
      branch:
        description: "Target branch (defaults to workflow branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run-operation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run read-only repository operation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OPERATION: ${{ inputs.operation || github.event.inputs.operation || 'repository_status' }}
          REQUEST_PATH: ${{ inputs.path || github.event.inputs.path || '' }}
          TARGET_BRANCH: ${{ inputs.branch || github.event.inputs.branch || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            repository_status)
              gh api "repos/$GH_REPO" --jq '"- Repository: " + .full_name + "\n- Default branch: " + .default_branch + "\n- Visibility: " + .visibility' >> "$GITHUB_STEP_SUMMARY"
              ;;
            list_files)
              if [[ -z "$REQUEST_PATH" ]]; then
                echo "::error::path is required for list_files (use . for repository root)"
                exit 1
              fi
              [[ "$REQUEST_PATH" == "." || "$REQUEST_PATH" == "/" ]] && REQUEST_PATH=""
              gh api "repos/$GH_REPO/contents/$REQUEST_PATH?ref=$TARGET_BRANCH" --jq 'if type == "array" then .[] | "- " + .type + ": " + .path else "- " + .type + ": " + .path end' >> "$GITHUB_STEP_SUMMARY"
              ;;
            read_file)
              if [[ -z "$REQUEST_PATH" ]]; then
                echo "::error::path is required for read_file"
                exit 1
              fi
              echo "### $REQUEST_PATH" >> "$GITHUB_STEP_SUMMARY"
              gh api "repos/$GH_REPO/contents/$REQUEST_PATH?ref=$TARGET_BRANCH" --jq '.content' | tr -d '\n' | base64 --decode >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::Unsupported operation. This workflow is read-only; use the reviewed sync workflow for approved memory writes."
              exit 1
              ;;
          esac
