name: Sync Approved Course Data

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Pending source path (must be under pending/)"
        required: true
        default: "pending/course/course-source.json"
        type: string
      target_path:
        description: "New canonical target (shared/course/course-data.json or data/course/course-data.json)"
        required: true
        default: "shared/course/course-data.json"
        type: string
      approval_note:
        description: "Explicit single-line approval note (1-300 characters)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: approved-course-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Validate approval request and source path
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_PATH: ${{ inputs.target_path }}
          APPROVAL_NOTE: ${{ inputs.approval_note }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_PATH" == pending/* ]] || { echo "::error::Source must start with pending/"; exit 1; }
          [[ "$TARGET_PATH" == shared/* || "$TARGET_PATH" == data/* ]] || { echo "::error::Target must start with shared/ or data/"; exit 1; }
          [[ "$SOURCE_PATH" != *".."* && "$TARGET_PATH" != *".."* ]] || { echo "::error::Path traversal is blocked"; exit 1; }
          [[ "$SOURCE_PATH" != *"\"* && "$TARGET_PATH" != *"\"* ]] || { echo "::error::Backslashes are blocked"; exit 1; }
          [[ "$SOURCE_PATH" == *.json && "$TARGET_PATH" == *.json ]] || { echo "::error::Only JSON is supported for course sync"; exit 1; }
          [[ "$TARGET_PATH" == "shared/course/course-data.json" || "$TARGET_PATH" == "data/course/course-data.json" ]] || { echo "::error::Unsupported target path"; exit 1; }
          [[ -n "$APPROVAL_NOTE" && ${#APPROVAL_NOTE} -le 300 ]] || { echo "::error::Approval note must be 1-300 characters"; exit 1; }
          [[ "$APPROVAL_NOTE" != *$'\n'* && "$APPROVAL_NOTE" != *$'\r'* ]] || { echo "::error::Approval note must be one line"; exit 1; }
          [[ -f "$SOURCE_PATH" && ! -L "$SOURCE_PATH" ]] || { echo "::error::Source must exist and be a regular, non-symlink file"; exit 1; }
          for p in "$SOURCE_PATH" "$(dirname "$SOURCE_PATH")" "$(dirname "$TARGET_PATH")"; do
            [[ ! -L "$p" ]] || { echo "::error::Symlinked path component is blocked: $p"; exit 1; }
          done
          if grep -nE -i 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(api[_-]?key|access[_-]?token|refresh[_-]?token|password|client_secret)[[:space:]]*[:=][[:space:]]*["'\''"]?[A-Za-z0-9/_+=.-]{8,}' "$SOURCE_PATH"; then
            echo "::error::Potential secret-like content detected; approval sync blocked."
            exit 1
          fi
          node scripts/validate-course-data.mjs "$SOURCE_PATH"
      - name: Create approved data mirrors (create-only)
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_PATH: ${{ inputs.target_path }}
          APPROVAL_NOTE: ${{ inputs.approval_note }}
          GITHUB_ACTOR: ${{ github.actor }}
          APPROVED_AT: ${{ github.run_started_at }}
        run: node scripts/sync-course-data.mjs
      - name: Append approval audit entry
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_PATH: ${{ inputs.target_path }}
          APPROVAL_NOTE: ${{ inputs.approval_note }}
          INITIATED_BY: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          printf '\n- Timestamp: %s\n  - Status: sync changes prepared; final run conclusion is the linked GitHub Actions run\n  - Actor: %s\n  - Source: %s\n  - Requested target: %s\n  - Mirrors: shared/course/course-data.json; data/course/course-data.json; hap-aicc/data/course-data.json\n  - Run ID: %s\n  - Input commit SHA: %s\n  - Evidence URL: %s/%s/actions/runs/%s\n  - Approval note: %s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$INITIATED_BY" "$SOURCE_PATH" "$TARGET_PATH" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$APPROVAL_NOTE" >> logs/approval-log.md
          printf '\n## %s — Sync Approved Course Data\n- Status: Inconclusive until the linked run reaches a final conclusion\n- Actor: %s\n- Run ID: %s\n- Input commit SHA: %s\n- Evidence URL: %s/%s/actions/runs/%s\n- Task: create approved course dataset and mirrors\n- Note: final result must be read from the linked run; workflow definition is not execution proof\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$INITIATED_BY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> logs/workflow-evidence.md
      - name: Commit approved dataset and audit records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- shared/course/course-data.json data/course/course-data.json hap-aicc/data/course-data.json logs/approval-log.md logs/workflow-evidence.md
          git commit -m "Approve course data via manual workflow run $GITHUB_RUN_ID"
          git push origin HEAD:main
      - name: Summarize approval action
        if: always()
        env:
          SOURCE_PATH: ${{ inputs.source_path }}
          TARGET_PATH: ${{ inputs.target_path }}
          INITIATED_BY: ${{ github.actor }}
        shell: bash
        run: |
          {
            echo "## Approval-gated course sync"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Input commit SHA: $GITHUB_SHA"
            echo "- Actor: $INITIATED_BY"
            echo "- Source: $SOURCE_PATH"
            echo "- Requested target: $TARGET_PATH"
            echo "- Evidence URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- This manual workflow is the approval action. No workflow was dispatched by the implementation task."
          } >> "$GITHUB_STEP_SUMMARY"
