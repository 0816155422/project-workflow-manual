name: Sync Approved Memory

on:
  workflow_dispatch:
    inputs:
      source_path:
        description: "Pending file path (must be under pending/)"
        required: true
        type: string
      target_path:
        description: "Destination path (must be under shared/)"
        required: true
        type: string
      approval_note:
        description: "Short approval note for the audit log"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: approved-memory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate request and copy approved file
        env:
          SOURCE_PATH: \${{ inputs.source_path }}
          TARGET_PATH: \${{ inputs.target_path }}
          APPROVAL_NOTE: \${{ inputs.approval_note }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_PATH" == pending/* ]] || { echo "::error::Source must be under pending/"; exit 1; }
          [[ "$TARGET_PATH" == shared/* ]] || { echo "::error::Destination must be under shared/"; exit 1; }
          [[ "$SOURCE_PATH" != *".."* && "$TARGET_PATH" != *".."* ]] || { echo "::error::Path traversal is not allowed"; exit 1; }
          [[ "$SOURCE_PATH" != *"\\"* && "$TARGET_PATH" != *"\\"* ]] || { echo "::error::Backslashes are not allowed in paths"; exit 1; }
          [[ -f "$SOURCE_PATH" ]] || { echo "::error::Pending source file does not exist"; exit 1; }
          [[ "$SOURCE_PATH" == *.md || "$SOURCE_PATH" == *.json || "$SOURCE_PATH" == *.txt ]] || { echo "::error::Only Markdown, JSON, or TXT files can be synced"; exit 1; }
          [[ "$TARGET_PATH" == *.md || "$TARGET_PATH" == *.json || "$TARGET_PATH" == *.txt ]] || { echo "::error::Only Markdown, JSON, or TXT destinations are allowed"; exit 1; }
          [[ -n "$APPROVAL_NOTE" && "\${#APPROVAL_NOTE}" -le 300 ]] || { echo "::error::Approval note must be 1-300 characters"; exit 1; }

          mkdir -p "$(dirname "$TARGET_PATH")" logs
          if [[ -e "$TARGET_PATH" ]]; then
            echo "::error::Destination already exists; use a reviewed pull request to update existing approved memory."
            exit 1
          fi

          if grep -nE -i 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(["'"'"']?(api[_-]?key|access[_-]?token|password|client_secret)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9/_+=.-]{16,})' "$SOURCE_PATH"; then
            echo "::error::Potential credential detected; approval sync blocked."
            exit 1
          fi
          if [[ "$SOURCE_PATH" == *.json ]]; then jq empty "$SOURCE_PATH"; fi
          if [[ "$TARGET_PATH" == *.json ]]; then jq empty "$SOURCE_PATH"; fi

          cp "$SOURCE_PATH" "$TARGET_PATH"
          printf '\n- %s — approved by %s; source: %s; destination: %s\n  - Note: %s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_ACTOR" "$SOURCE_PATH" "$TARGET_PATH" "$APPROVAL_NOTE" \
            >> logs/approval-log.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH" logs/approval-log.md
          git commit -m "Approve shared memory: $TARGET_PATH"
          git push origin HEAD:main

      - name: Summarize sync
        if: success()
        run: |
          {
            echo "## Approved memory sync complete"
            echo "- Source: \`${{ inputs.source_path }}\`"
            echo "- Destination: \`${{ inputs.target_path }}\`"
            echo "- Initiated by: \`${{ github.actor }}\`"
            echo "- This workflow is manual; running it is the explicit approval action."
          } >> "$GITHUB_STEP_SUMMARY"
