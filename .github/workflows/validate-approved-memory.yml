name: Validate Shared Memory

on:
  pull_request:
    branches: [main]
    paths: ["shared/**", "pending/**", "config/**", "platforms/**", "data/**", "public/**", "static-site/**", "scripts/validate-memory.sh"]
  push:
    branches: [main]
    paths: ["shared/**", "pending/**", "config/**", "platforms/**", "data/**", "public/**", "static-site/**", "scripts/validate-memory.sh"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON and scan likely secrets
        run: npm run validate:memory

      - name: Explain scan limitations
        shell: bash
        run: |
          echo "Secret scanning is heuristic only; a human must review pending content before approval." >> "$GITHUB_STEP_SUMMARY"
