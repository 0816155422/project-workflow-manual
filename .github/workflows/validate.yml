name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and static dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify MVP structure
        shell: bash
        run: |
          set -euo pipefail
          for path in README.md MEMORY_MANIFEST.md config docs shared pending logs archives platforms public static-site scripts hap-aicc/index.html .github/workflows/validate-approved-memory.yml .github/workflows/sync-approved-memory.yml .github/workflows/deploy-pages.yml; do
            test -e "$path" || { echo "::error::Required MVP path missing: $path"; exit 1; }
          done
          test ! -e .github/workflows/hap-aicc-pages.yml || {
            echo "::error::Duplicate Pages workflow remains enabled; remove it after confirming deploy-pages.yml is the selected workflow."
            exit 1
          }
          echo "MVP structure check passed."

      - name: Validate repository JSON files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find config shared pending logs archives platforms public static-site -type f -name '*.json' -print0 2>/dev/null || true)
          for file in "${files[@]}"; do
            echo "Checking JSON: $file"
            jq empty "$file"
          done
          echo "JSON validation passed for ${#files[@]} file(s)."

      - name: Scan repository text for likely credentials
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find shared pending config platforms public static-site -type f \( -name '*.md' -o -name '*.json' -o -name '*.txt' -o -name '*.html' -o -name '*.js' \) -print0 2>/dev/null || true)
          if (( ${#files[@]} == 0 )); then
            echo "No eligible files to scan."
            exit 0
          fi
          if grep -nE -i 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(api[_-]?key|access[_-]?token|password|client_secret)[[:space:]]*[:=][[:space:]]*[A-Za-z0-9/_+=.-]{16,}' "${files[@]}"; then
            echo "::error::Potential credential detected. This heuristic is not a guarantee; manually review and rotate any real exposed credential."
            exit 1
          fi
          echo "No likely credentials detected by heuristic scan (not a security guarantee)."

      - name: Validate dashboard HTML structure
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.html = self.head = self.body = self.title = 0
              def handle_starttag(self, tag, attrs):
                  if tag == "html": self.html += 1
                  if tag == "head": self.head += 1
                  if tag == "body": self.body += 1
                  if tag == "title": self.title += 1

          path = Path("hap-aicc/index.html")
          text = path.read_text(encoding="utf-8")
          parser = Checker()
          parser.feed(text)
          parser.close()
          assert parser.html == 1, "expected exactly one html root"
          assert parser.head == 1, "expected exactly one head"
          assert parser.body == 1, "expected exactly one body"
          assert parser.title == 1, "expected exactly one title"
          assert "HAP/AICC" in text, "dashboard title/content missing"
          print("Dashboard HTML structural checks passed")
          PY
