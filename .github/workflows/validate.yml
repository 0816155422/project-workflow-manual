name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository and static dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify MVP files and folders
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f MEMORY_MANIFEST.md
          test -f package.json
          test -f scripts/validate-memory.sh
          test -f pending/test-memory.md
          test -f hap-aicc/index.html
          for dir in config docs shared pending logs archives platforms public static-site scripts; do
            test -d "$dir" || { echo "::error::Required directory missing: $dir"; exit 1; }
          done
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts['validate:json'] || !p.scripts['validate:memory']) process.exit(1); console.log('Package scripts OK')"

      - name: Validate JSON and heuristic secret patterns
        run: npm run validate:memory

      - name: Check API JavaScript syntax (no install or backend deployment)
        run: node --check api/mcp.js

      - name: Validate dashboard HTML structure
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.html = self.head = self.body = self.title = 0
              def handle_starttag(self, tag, attrs):
                  if tag == "html": self.html += 1
                  if tag == "head": self.head += 1
                  if tag == "body": self.body += 1
                  if tag == "title": self.title += 1

          path = Path("hap-aicc/index.html")
          text = path.read_text(encoding="utf-8")
          parser = Checker()
          parser.feed(text)
          parser.close()
          assert parser.html == 1, "expected exactly one html root"
          assert parser.head == 1, "expected exactly one head"
          assert parser.body == 1, "expected exactly one body"
          assert parser.title == 1, "expected exactly one title"
          assert "HAP/AICC" in text, "dashboard title/content missing"
          print("Dashboard HTML structural checks passed")
          PY
