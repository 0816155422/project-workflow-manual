name: IRIS Working Runtime Tests
on:
  push:
    branches: [reconstruction/operating-work-lifecycle-state]
    paths: ['iris_runtime/**','tests/**','requirements.txt','.github/workflows/iris-runtime-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
